name: SC-SEO-02 synthetic tests

on:
  pull_request:
    branches: [main, 'integration/**', 'feature/**', 'codex/**']
    paths:
      - 'seo_*.py'
      - 'contracts/**'
      - 'fixtures/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - 'tests/**'
      - 'remediation/**'
      - 'studio/**'
      - 'deploy/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python3 -m py_compile seo_*.py scripts/*.py
      - name: Synthetic unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check no real exports or local reports are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^data/|^output/|^private/|\.(xlsx|xls|tsv)$|\.env$|^reports/)'; then
            echo 'Unexpected private or exported file tracked' >&2
            exit 1
          fi
          echo 'No private export paths tracked'
  studio-identity:
    # Re-runs the suite with the optional `cryptography` dependency so the Workspace-session tests are not skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional Studio server dependency (pinned)
        run: python3 -m pip install 'cryptography==44.0.1'
      - name: Tests including authenticated Studio and session refusals
        run: python3 -m unittest discover -s tests -v
      - name: Staging kit builds (no evidence in the image) and scripts parse
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/staging/import-baseline.sh deploy/staging/rehearse.sh
          docker build -q -t sc-seo-intelligence:ci -f deploy/staging/Dockerfile .
          docker run --rm --entrypoint sh sc-seo-intelligence:ci -c 'id -u; ls /app; test ! -e /app/tests && test ! -e /app/evidence'
          docker compose -f deploy/staging/compose.yml config -q
        env:
          SEO_IMAGE_TAG: ci
          SEO_STAGING_ALLOW: workspace-user:ci
          SEO_STAGING_SESSION_URL: https://workspace.example.invalid/v1/seo-access/session
          SEO_STAGING_KEYRING: /dev/null
          SEO_STAGING_EVIDENCE: /tmp
      - name: Studio static assets load nothing external
        shell: bash
        run: |
          if grep -nE '(src|href)="https?://' studio/*.html; then echo 'External asset in Studio shell' >&2; exit 1; fi
  remediation-php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      - name: PHP syntax (WordPress remediation tools)
        shell: bash
        run: |
          set -euo pipefail
          find remediation -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Remediation tools contain no host or account identifiers
        shell: bash
        run: |
          if grep -rnE '(/home[0-9]*/|public_html|ssh |@[a-z0-9-]+\.(com|net) )' remediation; then
            echo 'Host-specific detail found in public remediation tools' >&2
            exit 1
          fi
