<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SEO Studio</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-session-url="__SESSION_URL__">
<header>
  <h1>SEO Studio</h1>
  <div id="who" aria-live="polite"></div>
  <label>Run <select id="run"></select></label>
  <div class="export"><label>Export <select id="export-scope"><option value="run">Entire run</option><option value="filtered">Current filters</option></select></label>
    <button id="export" type="button">Export to Excel</button><span id="export-status" class="note" aria-live="polite"></span></div>
</header>
<nav id="tabs" role="tablist">
  <button data-tab="overview" aria-selected="true">Overview</button>
  <button data-tab="technical">Technical health</button>
  <button data-tab="indexing">Indexing</button>
  <button data-tab="metadata">Metadata</button>
  <button data-tab="links">Broken links</button>
  <button data-tab="sitemaps">Sitemaps</button>
  <button data-tab="structured">Structured data</button>
  <button data-tab="publications">Publications</button>
  <button data-tab="kb">Knowledge Base</button>
  <button data-tab="pages">Pages</button>
  <button data-tab="recommendations">Recommendations</button>
  <button data-tab="history">History</button>
</nav>
<main id="view"><p>Signing in with Sustainable Catalyst…</p></main>
<dialog id="detail"><button id="close" aria-label="Close">×</button><div id="detail-body"></div></dialog>
<footer>Read-only. Measured = recomputed from observations in this run · Prior = earlier audit classification ·
Inferred = recommendation awaiting human approval. Nothing here changes a website.</footer>
<script src="/app.js"></script>
</body>
</html>
